name: Release sPanel

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build Web Application
        run: |
          cd web
          npm ci
          npm run build

      - name: Compile Linux AMD64 Binary
        env:
          CGO_ENABLED: '0'
          GOOS: 'linux'
          GOARCH: 'amd64'
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="v1.0.0-snapshot"
          fi
          go build -ldflags="-s -w -X 'spanel/internal/config.Version=${VERSION}'" -o spanel_linux_amd64 cmd/server/main.go

      - name: Compile Linux ARM64 Binary
        env:
          CGO_ENABLED: '0'
          GOOS: 'linux'
          GOARCH: 'arm64'
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="v1.0.0-snapshot"
          fi
          go build -ldflags="-s -w -X 'spanel/internal/config.Version=${VERSION}'" -o spanel_linux_arm64 cmd/server/main.go

      - name: Generate Checksums
        run: |
          sha256sum spanel_linux_amd64 spanel_linux_arm64 > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            spanel_linux_amd64
            spanel_linux_arm64
            checksums.txt
          generate_release_notes: true
